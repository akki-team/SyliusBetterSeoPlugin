services:
    joppedc_sylius_better_seo_plugin.product.type_extension:
        class: JoppeDc\SyliusBetterSeoPlugin\Form\ProductTypeExtension
        tags:
            - { name: form.type_extension, extended_type: Sylius\Bundle\ProductBundle\Form\Type\ProductType, priority: -5 }

    joppedc_sylius_better_seo_plugin.taxon.type_extension:
        class: JoppeDc\SyliusBetterSeoPlugin\Form\TaxonTypeExtension
        tags:
            - { name: form.type_extension, extended_type: Sylius\Bundle\TaxonomyBundle\Form\Type\TaxonType, priority: -5 }

    joppedc_sylius_better_seo_plugin.seo.form.type:
        class: JoppeDc\SyliusBetterSeoPlugin\Form\Type\SeoType
        tags:
            - { name: form.type }
        arguments: ['%sylius_better_seo_plugin.model.seo.class%', ['sylius']]

    joppedc_sylius_better_seo_plugin.seo_translation.form.type:
        class: JoppeDc\SyliusBetterSeoPlugin\Form\Type\SeoTranslationType
        tags:
            - { name: form.type }
        arguments: ['%sylius_better_seo_plugin.model.seo_translation.class%', ['sylius']]

    joppedc_sylius_better_seo_plugin.seo_image.type.form.type:
        class: JoppeDc\SyliusBetterSeoPlugin\Form\Type\SeoImageType
        tags:
            - { name: form.type }
        arguments: ['%sylius_better_seo_plugin.model.seo_image.class%', ['sylius']]

    # La couche d'affichage du plugin reposait sur les « template events » de Sylius 1 :
    # six services `Sylius\Bundle\UiBundle\Block\BlockEventListener` branches sur des
    # evenements SonataBlockBundle (`sonata.block.event.sylius.*`).
    #
    # Sylius 2 a supprime ce mecanisme, classe incluse, au profit de `sylius/twig-hooks`.
    # Ces services etaient donc invalides par construction : `lint:container` echouait sur
    # « class Sylius\Bundle\UiBundle\Block\BlockEventListener does not exist ».
    #
    # Ils ne sont pas portes vers des hooks car le projet a deja son propre affichage SEO :
    #   - front  : composants Twig App\Twig\Components\*\StructuredData
    #   - admin  : hooks `uh_seo` de config/packages/sylius_twig_hooks.yaml
    #              (@SyliusAdmin/product/form/sections/uh_seo.html.twig, channel/...)
    #
    # Du plugin, le projet ne consomme que le modele de donnees SEO (Seo, SeoTranslation,
    # SeoInterface, HasSeoInterface, SeoTrait, SeoType, SeoImageType), conserve ci-dessus.
    #
    # Templates devenus orphelins, laisses en place : _seo_block.html.twig,
    # _structured_data.html.twig, _javascript.html.twig, Admin/Taxon/_seo_form.html.twig.

    joppedc_sylius_better_seo_plugin.listener.images_upload:
        class: JoppeDc\SyliusBetterSeoPlugin\EventListener\SeoTranslationImagesUploadListener
        parent: sylius.listener.images_upload
        autowire: true
        autoconfigure: false
        public: false
        tags:
            - { name: kernel.event_listener, event: sylius.product.pre_create, method: uploadMedia }
            - { name: kernel.event_listener, event: sylius.taxon.pre_create, method: uploadMedia }
            - { name: kernel.event_listener, event: sylius.product.pre_update, method: uploadMedia }
            - { name: kernel.event_listener, event: sylius.taxon.pre_update, method: uploadMedia }
